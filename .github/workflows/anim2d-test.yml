name: 2D animation test
on:
  push:
    branches: [main]
    paths: [".github/anim2d-test.txt"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg (static) and Hindi fonts
        timeout-minutes: 8
        run: |
          set -e
          curl -sSfL --retry 4 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf /tmp/ff.tar.xz -C /tmp
          sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          mkdir -p "$HOME/hfonts"
          # Mukta has Hindi + English glyphs in one matched design, so both scripts render the same size
          for f in Mukta-Regular.ttf Mukta-Bold.ttf Mukta-ExtraBold.ttf; do
            curl -sSfL --retry 4 -o "$HOME/hfonts/$f" "https://github.com/google/fonts/raw/main/ofl/mukta/$f"
          done
          echo "FONTS_DIR=$HOME/hfonts" >> "$GITHUB_ENV"
          echo "FONT=Mukta" >> "$GITHUB_ENV"
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters | grep -E " ass "
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests edge-tts
      - env:
          GH_TOKEN: ${{ github.token }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -e
          CH="wife: Indian woman about 30, simple green saree, long black braid, small bindi; husband: Indian man about 35, thin mustache, blue checked shirt"
          awk 'NR<=40' scripts/money13.txt > /tmp/anim_long.txt
          time python make_video.py scripts/money13_short.txt --short --anim2d --characters "$CH" --font "$FONT" --brand "Paisa Psychology" --voice hi-IN-MadhurNeural --rate +12%
          echo "CF secrets present: ${CF_ACCOUNT_ID:+yes}"
          [ -n "$CF_ACCOUNT_ID" ] && time python make_video.py /tmp/anim_long.txt --anim2d --characters "$CH" --font "$FONT" --brand "Paisa Psychology" --voice hi-IN-MadhurNeural
          for s in 2 8 14 20; do ffmpeg -loglevel error -y -ss $s -i output/money13_short.mp4 -frames:v 1 -vf scale=360:-1 s$s.png; done
          for s in 10 40 70; do ffmpeg -loglevel error -y -ss $s -i output/anim_long.mp4 -frames:v 1 -vf scale=960:-1 l$s.png; done
          cp output/money13_short.mp4 anim2d_short_sample.mp4; cp output/anim_long.mp4 anim2d_long_sample.mp4
          gh release view fonttest >/dev/null 2>&1 || gh release create fonttest --title "font test" --notes "test frames" --prerelease
          gh release upload fonttest s*.png l*.png anim2d_short_sample.mp4 anim2d_long_sample.mp4 --clobber
