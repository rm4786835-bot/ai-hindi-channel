name: Build videos

on:
  push:
    branches: [main]
    paths: ["scripts/**", "make_video.py", "build_all.py", "upload_youtube.py"]
  workflow_dispatch:
    inputs:
      check_tokens:
        description: "Only check YouTube tokens"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-videos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Hindi font
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do
            sudo timeout 240 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && \
            sudo timeout 300 apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg fonts-noto-core && break
            echo "apt attempt $i failed, retrying"; sleep 15
          done
          ffmpeg -version | head -1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install edge-tts pillow requests
      - name: Check YouTube tokens
        if: ${{ inputs.check_tokens }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_TECH: ${{ secrets.YT_TOKEN_TECH }}
          YT_TOKEN_ENGLISH: ${{ secrets.YT_TOKEN_ENGLISH }}
          YT_TOKEN_MONEY: ${{ secrets.YT_TOKEN_MONEY }}
        run: python upload_youtube.py --check
      - name: Build, publish and upload new days
        if: ${{ !inputs.check_tokens }}
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_TECH: ${{ secrets.YT_TOKEN_TECH }}
          YT_TOKEN_ENGLISH: ${{ secrets.YT_TOKEN_ENGLISH }}
          YT_TOKEN_MONEY: ${{ secrets.YT_TOKEN_MONEY }}
        run: python build_all.py
