name: Build videos

on:
  push:
    branches: [main]
    paths: ["scripts/**", "make_video.py", "build_all.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-videos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Hindi font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install edge-tts pillow
      - name: Build and publish new days
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build_all.py
