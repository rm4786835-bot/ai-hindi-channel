name: Build videos

on:
  push:
    branches: [main]
    paths: ["scripts/**", "make_video.py", "build_all.py", "upload_youtube.py", ".github/workflows/build-videos.yml"]
  workflow_dispatch:
    inputs:
      check_tokens:
        description: "Only check YouTube tokens"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-videos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg (static) and Hindi fonts
        timeout-minutes: 8
        run: |
          set -e
          curl -sSfL --retry 4 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf /tmp/ff.tar.xz -C /tmp
          sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          mkdir -p "$HOME/hfonts"
          # Mukta has Hindi + English glyphs in one matched design, so both scripts render the same size
          for f in Mukta-Regular.ttf Mukta-Bold.ttf Mukta-ExtraBold.ttf; do
            curl -sSfL --retry 4 -o "$HOME/hfonts/$f" "https://github.com/google/fonts/raw/main/ofl/mukta/$f"
          done
          echo "FONTS_DIR=$HOME/hfonts" >> "$GITHUB_ENV"
          echo "FONT=Mukta" >> "$GITHUB_ENV"
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters | grep -E " ass "
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install edge-tts pillow requests
      - name: Check YouTube tokens
        if: ${{ inputs.check_tokens }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_TECH: ${{ secrets.YT_TOKEN_TECH }}
          YT_TOKEN_ENGLISH: ${{ secrets.YT_TOKEN_ENGLISH }}
          YT_TOKEN_MONEY: ${{ secrets.YT_TOKEN_MONEY }}
        run: python upload_youtube.py --check
      - name: Build, publish and upload new days
        if: ${{ !inputs.check_tokens }}
        env:
          GH_TOKEN: ${{ github.token }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_TECH: ${{ secrets.YT_TOKEN_TECH }}
          YT_TOKEN_ENGLISH: ${{ secrets.YT_TOKEN_ENGLISH }}
          YT_TOKEN_MONEY: ${{ secrets.YT_TOKEN_MONEY }}
        run: python build_all.py
