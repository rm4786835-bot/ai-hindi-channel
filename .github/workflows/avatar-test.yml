name: Avatar test
on:
  push:
    branches: [main]
    paths: [".github/avatar-test.txt"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg and fonts
        run: |
          set -e
          curl -sSfL --retry 4 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf /tmp/ff.tar.xz -C /tmp
          sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          mkdir -p "$HOME/hfonts"
          for f in Mukta-Regular.ttf Mukta-Bold.ttf; do curl -sSfL --retry 4 -o "$HOME/hfonts/$f" "https://github.com/google/fonts/raw/main/ofl/mukta/$f"; done
          echo "FONTS_DIR=$HOME/hfonts" >> "$GITHUB_ENV"; echo "FONT=Mukta" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: SadTalker (CPU)
        run: |
          set -e
          git clone --depth 1 https://github.com/OpenTalker/SadTalker
          pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy==1.23.5" face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg librosa==0.9.2 "numba<0.59" resampy pydub scipy==1.10.1 kornia==0.6.8 tqdm yacs pyyaml joblib scikit-image==0.19.3 basicsr==1.4.2 facexlib==0.3.0 gfpgan av safetensors edge-tts opencv-python-headless==4.8.1.78 requests
          f=$(python -c "import basicsr,os;print(os.path.join(os.path.dirname(basicsr.__file__),'data','degradations.py'))")
          sed -i 's/torchvision.transforms.functional_tensor/torchvision.transforms.functional/' "$f"
          cd SadTalker && mkdir -p checkpoints gfpgan/weights
          B=https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc
          for m in mapping_00109-model.pth.tar mapping_00229-model.pth.tar SadTalker_V0.0.2_256.safetensors SadTalker_V0.0.2_512.safetensors; do curl -sSfL --retry 4 -o checkpoints/$m $B/$m; done
          curl -sSfL --retry 4 -o gfpgan/weights/alignment_WFLW_4HG.pth https://github.com/xinntao/facexlib/releases/download/v0.1.0/alignment_WFLW_4HG.pth
          curl -sSfL --retry 4 -o gfpgan/weights/detection_Resnet50_Final.pth https://github.com/xinntao/facexlib/releases/download/v0.1.0/detection_Resnet50_Final.pth
          ls -la checkpoints
      - name: Make sample
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          export SADTALKER_DIR=$PWD/SadTalker
          time python avatar_video.py --photo avatar/face1.jpg --script avatar/sample_script.txt --out output/avatar_sample.mp4 --brand "Paisa Psychology"
          for s in 1 6 12; do ffmpeg -loglevel error -y -ss $s -i output/avatar_sample.mp4 -frames:v 1 -vf scale=540:-1 av$s.png; done
          cp output/avatar_sample.mp4 avatar_sample.mp4
          gh release view fonttest >/dev/null 2>&1 || gh release create fonttest --title "font test" --notes "test frames" --prerelease
          gh release upload fonttest av1.png av6.png av12.png avatar_sample.mp4 --clobber
